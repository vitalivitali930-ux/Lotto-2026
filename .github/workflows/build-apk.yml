name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies & Cordova
      run: |
        npm install
        sudo npm install -g cordova

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.2 platform-tools'

    - name: Prepare Cordova and Build APK
      run: |
        cordova create ../cordova-build com.zerochaos.app ZeroApp
        cd ../cordova-build

        rm -rf www/*
        cp -r $GITHUB_WORKSPACE/* www/

        cordova platform add android
        # Явно указываем сборку именно APK-файла
        cordova build android --release -- --packageType=apk

        mkdir -p $GITHUB_WORKSPACE/output
        cp platforms/android/app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/output/

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: output/
