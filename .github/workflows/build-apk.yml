name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies & Cordova
      run: |
        npm install
        sudo npm install -g cordova

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.2 platform-tools'

    - name: Prepare Cordova, Build and Sign APK
      run: |
        cordova create ../cordova-build com.zerochaos.app ZeroApp
        cd ../cordova-build

        rm -rf www/*
        cp -r $GITHUB_WORKSPACE/* www/

        cordova platform add android
        cordova build android --release -- --packageType=apk

        # Генерируем временный debug/release ключ для подписи прямо на раннере
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

        # Подписываем APK
        jarsigner -keystore debug.keystore -storepass android -keypass android platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk androiddebugkey

        # Выравниваем APK (zipalign)
        $ANDROID_SDK_ROOT/build-tools/33.0.2/zipalign -v 4 platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk

        mkdir -p $GITHUB_WORKSPACE/output
        cp app-release.apk $GITHUB_WORKSPACE/output/

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: output/
