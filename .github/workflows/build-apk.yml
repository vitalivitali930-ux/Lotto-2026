name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies & Cordova
      run: |
        npm install
        sudo npm install -g cordova

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;33.0.2 platform-tools'

    - name: Build and Sign APK
      run: |
        cordova create ../cordova-build com.zerochaos.app ZeroApp
        cd ../cordova-build

        rm -rf www/*
        cp -r $GITHUB_WORKSPACE/* www/

        cordova platform add android
        cordova build android --release -- --packageType=apk

        # Генерируем ключ для подписи
        keytool -genkey -v -keystore release.keystore -storepass android -alias androidkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ZeroChaos,O=Dev,C=DE"

        # Подписываем созданный APK
        jarsigner -keystore release.keystore -storepass android -keypass android platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk androidkey

        # Выравниваем (zipalign) в итоговый готовый файл
        $ANDROID_SDK_ROOT/build-tools/33.0.2/zipalign -v 4 platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk app-release-signed.apk

        mkdir -p $GITHUB_WORKSPACE/output
        cp app-release-signed.apk $GITHUB_WORKSPACE/output/app-release.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-final
        path: output/
